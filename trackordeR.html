<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .confirmation-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 7%;
            background-color: #f1f7f83c;
            border-radius: 5%;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 {
            color: #333;
        }
        p {
            color: #555;
            line-height: 1.6;
        }
        .tracking-button {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            color: #000000;
            background-color: #007bff75;
            text-decoration: none;
            border-radius: 5px;
        }
        .tracking-button:hover {
            background-color: #0977e6;
        }
    </style>
</head>
<body>
    <div class="confirmation-container">
        <h1>Order Confirmed!</h1>
        <p>Your order has been successfully placed. Thank you for shopping with us!</p>
        <p>You can track the status of your order by clicking the button below:</p>
        <a href="index.html" class="tracking-button">Track Your Order</a>
    </div>
</body>
</html>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Background Video Example</title>
  <style>
    #bgVideo {
      position: fixed;        
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;      
      z-index: -1;             
    }

    .content {
      position: relative;
      z-index: 1;             
      color: white;
      text-align: center;
      padding: 50px;
    }
  </style>
</head>
<body>
  <video autoplay muted loop id="bgVideo">
    <source src="background.jpg.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

</body>
