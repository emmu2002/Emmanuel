        }
        .card img {

            height: auto;
            border-radius: 4px;
        }
        .card h3 {
            font-size: 1.2em;
            margin: 10px 0;

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Background Video Example</title>
  <style>
    #bgVideo {
      position: fixed;        
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;      
      z-index: -1;             
    }

    .content {
      position: relative;
      z-index: 1;             
      color: rgb(246, 239, 239);
      text-align: center;
      padding: 40px;
    }
  </style>
</head>
<body>
  <video autoplay muted loop id="bgVideo">
    <source src="background.jpg.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

</body>
